# Local development only: ./gradlew bootRun --args='--spring.profiles.active=local'
# Needs the stubs from scripts/docker/compose.yaml.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # WireMock serves the public part of the development key (scripts/security), get a token with
          # ./gradlew -q devToken -Proles=ADMIN. With jwk-set-uri present the issuer is only compared
          # with the "iss" claim, nothing is called
          jwk-set-uri: http://localhost:8090/.well-known/jwks.json
          issuer-uri: http://localhost:8090

# Lets the committee client log in with X-API-Key: committee-local-key
application:
  security:
    api-keys:
      intergalactic-committee:
        key-sha256: 91c582005df797145d5bcfe9bafd905d1bd733d9c4317fd6c6bcfbab9102c196
