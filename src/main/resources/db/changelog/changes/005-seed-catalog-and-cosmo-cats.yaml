                  value: Kepler-452b
      rollback:
        - sql:
            sql: >
              DELETE FROM product WHERE reference::text LIKE 'aaaaaaaa-%';
              DELETE FROM category WHERE reference::text LIKE '11111111-%'
              OR reference::text LIKE '22222222-%' OR reference::text LIKE '33333333-%';
              DELETE FROM cosmo_cat WHERE reference::text LIKE 'cccccccc-%';
