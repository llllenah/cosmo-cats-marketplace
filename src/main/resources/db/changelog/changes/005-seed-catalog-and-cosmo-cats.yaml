databaseChangeLog:
  - changeSet:
      id: 005-seed-catalog-and-cosmo-cats
      author: llllenah
      comment: Catalog and cats from the previous labs, their ids are used in README examples
      changes:
        # ids come from the sequences, so the ids Hibernate takes later do not clash with them
        - insert:
            tableName: category
            columns:
              - column:
                  name: id
                  valueComputed: nextval('category_id_seq')
              - column:
                  name: reference
                  value: 11111111-1111-1111-1111-111111111111
              - column:
                  name: name
                  value: "Anti-gravity toys"
