spring:
  application:
    name: cosmo-cats-marketplace
  jackson:
    deserialization:
      # By default Jackson silently truncates 2.7 to 2 for integer fields like stockQuantity
      accept-float-as-int: false
  # Local database: docker compose -f scripts/docker/compose.yaml up -d
  # Other environments set DB_URL, DB_USERNAME and DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cosmo_cats}
    username: ${DB_USERNAME:cosmo_cats}
    password: ${DB_PASSWORD:cosmo_cats}
  jpa:
    # The schema belongs to Liquibase, Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    # No lazy loading in controllers: the services return domain objects mapped inside a transaction
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Stock of several products changes in one order; updating rows sorted by id means two
        # orders always lock them in the same order and cannot deadlock each other
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-specs/cosmo-cats-product-api.yml

# Feature toggles, checked by FeatureToggleAspect for methods marked with @FeatureToggle.
# Can be overridden per environment, e.g. FEATURE_COSMOCATS_ENABLED=false
feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false

application:
  kitty-products:
    # Anti-gravity toys
    category-id: 11111111-1111-1111-1111-111111111111
  pricing:
    # Currency of all product prices in the catalog
    base-currency: USD
  # External service with currency exchange rates (stubbed with WireMock in tests)
  exchange-rate-service:
    base-url: http://localhost:8090
    connect-timeout: 1s
    read-timeout: 2s
