spring:
  application:
    name: cosmo-cats-marketplace
  jackson:
    deserialization:
      # By default Jackson silently truncates 2.7 to 2 for integer fields like stockQuantity
      accept-float-as-int: false
  # Local database: docker compose -f scripts/docker/compose.yaml up -d
  # Other environments set DB_URL, DB_USERNAME and DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cosmo_cats}
    username: ${DB_USERNAME:cosmo_cats}
    password: ${DB_PASSWORD:cosmo_cats}
  jpa:
    # The schema belongs to Liquibase, Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    # No lazy loading in controllers: the services return domain objects mapped inside a transaction
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Stock of several products changes in one order; updating rows sorted by id means two
        # orders always lock them in the same order and cannot deadlock each other
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      # /api/** accepts OAuth 2.0 bearer tokens (JWT). The keys of the identity provider are read
      # from its JWKS. Locally it is a file served by WireMock: docker compose starts it on 8090
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
          # With jwk-set-uri present the issuer is only compared with the "iss" claim, nothing is called
          issuer-uri: ${JWT_ISSUER:http://localhost:8090}
          # A token issued by the same provider for another service must not work here
          audiences: cosmo-cats-marketplace
          jws-algorithms: RS256
      # Pages for people (Swagger UI, /account) use OAuth 2.0 login with GitHub.
      # Create an OAuth app (callback http://localhost:8080/login/oauth2/code/github) and set both variables
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-is-not-set}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-is-not-set}
            scope: read:user

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-specs/cosmo-cats-product-api.yml

# Feature toggles, checked by FeatureToggleAspect for methods marked with @FeatureToggle.
# Can be overridden per environment, e.g. FEATURE_COSMOCATS_ENABLED=false
feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false

application:
  security:
    # Machine clients that send X-API-Key instead of a token. Only the SHA-256 of a key is kept here,
    # so reading the configuration does not give anybody a working key.
    # An empty hash means the client cannot log in at all.
    api-keys:
      intergalactic-committee:
        key-sha256: ${COMMITTEE_API_KEY_SHA256:}
        roles: COMMITTEE
  kitty-products:
    # Anti-gravity toys
    category-id: 11111111-1111-1111-1111-111111111111
  pricing:
    # Currency of all product prices in the catalog
    base-currency: USD
  # External service with currency exchange rates (stubbed with WireMock in tests)
  exchange-rate-service:
    base-url: http://localhost:8090
    connect-timeout: 1s
    read-timeout: 2s
