spring:
  application:
    name: cosmo-cats-marketplace
  jackson:
    deserialization:
      # By default Jackson silently truncates 2.7 to 2 for integer fields like stockQuantity
      accept-float-as-int: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-specs/cosmo-cats-product-api.yml

# Feature toggles, checked by FeatureToggleAspect for methods marked with @FeatureToggle.
# Can be overridden per environment, e.g. FEATURE_COSMOCATS_ENABLED=false
feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false

application:
  kitty-products:
    # Anti-gravity toys
    category-id: 11111111-1111-1111-1111-111111111111
  pricing:
    # Currency of all product prices in the catalog
    base-currency: USD
  # External service with currency exchange rates (stubbed with WireMock in tests)
  exchange-rate-service:
    base-url: http://localhost:8090
    connect-timeout: 1s
    read-timeout: 2s
