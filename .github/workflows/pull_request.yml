name: Build and Test Coverage

on:
  pull_request:
    branches:
      - main
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-gradle caches Gradle dependencies and the wrapper itself
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # build runs unit tests, integration tests (*IT), the JaCoCo report
      # and fails when a source file has less line coverage than required
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Publish test and coverage summary
        if: always()
        run: |
          if [ -f build/reports/tests/test-summary.md ]; then
            cat build/reports/tests/test-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/reports/coverage/coverage.csv ]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { printf "\n## Line coverage\n\n**%.1f%%** (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
              build/reports/coverage/coverage.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: build/reports/coverage/
          if-no-files-found: error
